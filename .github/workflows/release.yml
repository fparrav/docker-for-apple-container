name: Release

# Tag-only releases (design D3): fires when a `v*` tag is pushed, and only
# then. There is no manual dispatch and no package index publishing; the
# built sdist and wheel are attached to a GitHub Release and users install
# from the tag (`uv`/`pipx`, see the README).
#
# Trust boundary (design D6): the checks job runs the hosted checks with
# read-only permissions; only the release job grants `contents: write`, and
# it runs only after the checks pass. No credentials, hosted runners only,
# and third-party actions pinned to full commit SHAs (findings.md, spike 1.3).
#
# Live evidence (option B, versioned evidence, no extra runner): hosted runners cannot run the
# live tier, so a final tag `vX.Y.Z` needs a committed, recent evidence file
# for this exact code (`scripts/verify_release_evidence.py`, step in `checks`).
# Pre-release tags (rc, a, b, dev) skip it and are published as pre-releases.
# The tag reaches the script only through the environment, never the shell line.
#
# One set of files (design D8): `package` builds the sdist and wheel once,
# `smoke` installs that wheel in a clean virtual environment on the Python floor
# (pinned to ubuntu-24.04, the last image that ships it) and on the newest release
# (`scripts/verify_wheel.py`), and `release` publishes
# the same files without building again. The build checks out with full history
# (`fetch-depth: 0`) so hatch-vcs derives the version from the tag. The tag must
# be a valid PEP 440 version: `v0.0.1` builds, but a label such as
# `v0.0.1-spike` fails the build (findings.md, spike 1.1).
#
# Artifact actions (looked up with `gh api` when this was written):
#   actions/upload-artifact   v7.0.2 -> cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   actions/download-artifact v8.0.2 -> 9000827ccba6bdab643e8b6fd33ac0654aef8333

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: Hosted checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Test report (unit + fake)
        run: python3 scripts/test_report.py --tiers unit,fake
      - name: Compatibility matrix schema and coverage
        run: python3 -m unittest tests.test_compat_matrix tests.test_compat_matrix_schema -v
      - name: README compatibility block check
        run: python3 scripts/render_compat_table.py --check README.md
      - name: Byte-compile sources
        run: python3 -m compileall -q src scripts tests
      - name: Release evidence (final tags)
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/verify_release_evidence.py --tag "$TAG"

  package:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history: hatch-vcs derives the version from the tag
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
      - name: Upload the built files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Wheel smoke test (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: package
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor from pyproject.toml (requires-python). Pinned to
          # ubuntu-24.04 because it is the last hosted image whose
          # actions/python-versions manifest still ships CPython 3.9.
          - python: "3.9"
            os: ubuntu-24.04
          # The newest release, on the image that moves with GitHub.
          - python: "3.x"
            os: ubuntu-latest
          # The same wheel on a hosted macOS runner. It has no Apple
          # container runtime and no virtualization, so only the runtime-free
          # checks of verify_wheel.py run here; the live tier does not.
          - python: "3.x"
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install the wheel in a clean environment and exercise it
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/verify_wheel.py --dist dist --expect-version "${TAG#v}"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [checks, smoke]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Download the tested files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Generate release notes
        # GITHUB_STEP_SUMMARY is unset so the notes print to stdout and can
        # be captured; the script still writes report.json as a side effect.
        run: |
          env -u GITHUB_STEP_SUMMARY python3 scripts/test_report.py --tiers unit,fake --release-notes > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Release channel
        id: channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          channel=$(python3 scripts/verify_release_evidence.py --tag "$TAG" --print-channel)
          if [ "$channel" = "prerelease" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cite the live evidence in the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '\n' >> RELEASE_NOTES.md
          python3 scripts/verify_release_evidence.py --tag "$TAG" --notes >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.channel.outputs.prerelease }}
