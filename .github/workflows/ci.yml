name: CI

# Hosted-runner checks for every pull request and push to main, plus the
# conformance tier against the runner's real Docker Engine.
#
# Trust boundary (design D6): read-only permissions, no credentials, hosted
# runners only, no execution of untrusted code in protected contexts. The
# live tier never runs here; it is manual on the owner's machine
# (docs/testing.md, "CI limitation"). Third-party actions are pinned to full
# commit SHAs (findings.md, spike 1.3).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Hosted checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Test report (unit + fake)
        run: python3 scripts/test_report.py --tiers unit,fake
      - name: Compatibility matrix schema and coverage
        run: python3 -m unittest tests.test_compat_matrix tests.test_compat_matrix_schema -v
      - name: README compatibility block check
        run: python3 scripts/render_compat_table.py --check README.md
      - name: Byte-compile sources
        run: python3 -m compileall -q src scripts tests

  wheel:
    name: Wheel (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor from pyproject.toml (requires-python). Pinned to
          # ubuntu-24.04 because it is the last hosted image whose
          # actions/python-versions manifest still ships CPython 3.9.
          - python: "3.9"
            os: ubuntu-24.04
          # The newest release, on the image that moves with GitHub.
          - python: "3.x"
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history: hatch-vcs derives the version from git
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
      - name: Install the wheel in a clean environment and exercise it
        run: python3 scripts/verify_wheel.py --dist dist

  conformance:
    name: Conformance (real Docker Engine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Conformance test report
        # SHIM_CONFORMANCE_DOCKER must point at the runner's real Docker
        # client: on a Mac with this project installed, `docker` is the shim.
        # --require makes the job fail (exit 3) when any conformance test is
        # not run, skipped or missing, so a runner without Docker cannot pass
        # with zero executed tests.
        run: SHIM_TIERS=conformance SHIM_CONFORMANCE_DOCKER=$(which docker) python3 scripts/test_report.py --require conformance
      - name: Record Docker and Compose versions in the report
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def version(command):
              try:
                  proc = subprocess.run(command, capture_output=True, text=True)
              except (OSError, subprocess.SubprocessError):
                  return None
              return proc.stdout.strip() if proc.returncode == 0 else None

          path = Path("report.json")
          if not path.exists():
              raise SystemExit("report.json missing: the test report step did not complete")
          report = json.loads(path.read_text(encoding="utf-8"))
          report["docker"] = {
              "server_version": version(
                  ["docker", "version", "--format", "{{.Server.Version}}"]
              ),
              "compose_version": version(["docker", "compose", "version", "--short"]),
          }
          path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report["docker"]))
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: report.json
